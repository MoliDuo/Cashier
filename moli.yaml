name: MoliCashier
id: cashier
kind: web
level: L3

login:
  mode: P1
  client_id: moli-cashier

deploy:
  platform: docker
  domain: cashier.xiangyu.pro

data:
  db: postgres

release:
  kind: service

# License: AGPL-3.0-only today; the author has not decided whether to keep it (the standard default is
# all rights reserved), so it is left as is.
exceptions:
  - rule: "8.4.1"
    reason: One shared ledger with several login emails; users are bound by email by the admin CLI, not by preferred_username
    until: 2027-03-31
  - rule: "8.5.5"
    reason: Accounts are bound ahead of time by the admin CLI (scripts/account.ts); first login does not create a user
    until: 2027-03-31
  - rule: "10.3.2"
    reason: Existing Postgres database, role and S3 bucket are named "cashier"; renaming needs a data migration
    until: 2027-03-31
  - rule: "10.3.5"
    reason: One account owns the ledger; ownership is implicit in the book model, there is no per-row owner column
    until: 2027-03-31
  - rule: "10.6.1"
    reason: Single-stage image on purpose, it ships tsx and sources so the same image runs migrations and scripts
    until: 2027-03-31
