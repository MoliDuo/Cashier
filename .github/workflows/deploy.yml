# Deploys the commit that a green ci built (Moli standard 005). The server must have the app
# registered first (docs/deploy.md); the five DEPLOY_* organization secrets must be readable by this repository.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # deploys run one at a time

jobs:
  deploy:
    # Only after ci succeeded on main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The build, the temporary tailnet node and the SSH push live in MoliKit.
      - uses: MoliDuo/MoliKit/actions/deploy@dc80ccfe2668abc86e5de724c5a30312c33b1cab # v1.0.0
        with:
          app: cashier
          sha: ${{ github.event.workflow_run.head_sha }}
          # A host key is public; it is checked, not secret.
          host-key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGYuCUIofB2A+wuIb0aVrQgoIJH+UgVIYn0PSZtmFk+q"
          server: ${{ secrets.DEPLOY_SERVER }}
          server-user: ${{ secrets.DEPLOY_SERVER_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          tailscale-client-id: ${{ secrets.DEPLOY_TAILSCALE_CLIENT_ID }}
          tailscale-client-secret: ${{ secrets.DEPLOY_TAILSCALE_CLIENT_SECRET }}
