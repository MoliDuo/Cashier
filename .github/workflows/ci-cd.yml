name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Work reaches main by a direct push, so there is no PR gate to separate from
  # a main gate — both run the same thing. Pull requests still matter because
  # Dependabot opens them, and `check` ends in a production build, which is what
  # a bad dependency bump breaks.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the full gate
        run: npm run check

  # A real browser against a real build is the slowest thing here, so it waits
  # for the merge rather than running on every push and every PR.
  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
