# Development only: ports are published on 127.0.0.1 and the credentials are public local values.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashier_demo
      POSTGRES_USER: cashier
      POSTGRES_PASSWORD: cashier-local-only
    volumes:
      - cashier_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CASHIER_DEMO_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashier -d cashier_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3:
    image: ghcr.io/versity/versitygw:v1.8.0
    restart: unless-stopped
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY_ID: cashier
      ROOT_SECRET_ACCESS_KEY: cashier-local-only-secret
      VGW_PORT: ":7070"
      VGW_REGION: auto
      VGW_HEALTH: /health
    volumes:
      - cashier_s3:/data
    ports:
      - "127.0.0.1:${CASHIER_DEMO_S3_PORT:-59000}:7070"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-bootstrap:
    image: amazon/aws-cli:2.37.9
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: cashier
      AWS_SECRET_ACCESS_KEY: cashier-local-only-secret
      AWS_DEFAULT_REGION: auto
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://s3:7070 s3api head-bucket --bucket cashier 2>/dev/null || aws --endpoint-url http://s3:7070 s3api create-bucket --bucket cashier

volumes:
  cashier_postgres:
  cashier_s3:
