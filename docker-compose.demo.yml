services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashier_demo
      POSTGRES_USER: cashier
      POSTGRES_PASSWORD: cashier-local-only
    volumes:
      - cashier_postgres:/var/lib/postgresql/data
    ports:
      - "${CASHIER_DEMO_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashier -d cashier_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: cashier
      MINIO_ROOT_PASSWORD: cashier-local-only-secret
    volumes:
      - cashier_minio:/data
    ports:
      - "${CASHIER_DEMO_S3_PORT:-59000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 cashier cashier-local-only-secret &&
        mc mb --ignore-existing local/cashier

volumes:
  cashier_postgres:
  cashier_minio:
