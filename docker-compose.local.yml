services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashier
      POSTGRES_USER: cashier
      POSTGRES_PASSWORD: cashier-local-only
    volumes:
      - cashier_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashier -d cashier"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: cashier
      MINIO_ROOT_PASSWORD: cashier-local-only-secret
    volumes:
      - cashier_minio:/data
    ports:
      - "${S3_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 cashier cashier-local-only-secret &&
        mc mb --ignore-existing local/cashier

  app:
    environment:
      DATABASE_URL: postgresql://cashier:cashier-local-only@postgres:5432/cashier
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
      S3_REGION: auto
      S3_BUCKET: cashier
      S3_ACCESS_KEY_ID: cashier
      S3_SECRET_ACCESS_KEY: cashier-local-only-secret
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      storage-bootstrap:
        condition: service_completed_successfully

volumes:
  cashier_postgres:
  cashier_minio:
